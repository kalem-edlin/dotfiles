source-file ~/.config/tmux/tmux.reset.conf
# Applications see tmux's capabilities, not the outer Ghostty terminal's.
set-option -g default-terminal 'tmux-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'
# OSC 52 clipboard over SSH. The clipboard terminal-feature installs tmux's
# canonical Ms capability for every client TERM (screen-256color rw attach
# clients have no Ms in terminfo). The previous ',*:Ms=\E]52;c;%p2%s\a'
# terminal-override BROKE forwarding everywhere: a %p2-only Ms string fails
# tiparm expansion ("could not expand Ms" in tmux -vvv), so tmux silently
# emitted nothing -- and the override also replaced the working terminfo Ms
# of terminals that had one. Indexed assignment keeps config reloads
# idempotent (set -as would append a duplicate entry per reload).
set -s terminal-features[8] '*:clipboard'

bind-key T swap-window -t 1

set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g allow-passthrough on      # let OSC 52 reach the terminal (for clipboard over SSH)
set -g allow-set-title off       # app spinner titles must not trigger status redraws
set -g visual-activity off       # keep image rendering free of tmux activity messages
set-option -g focus-events on    # forward focus changes so images clear and redraw correctly
set -g status-position bottom       # macOS / darwin style
setw -g mode-keys vi

# Keep a shell's first submitted command as its window label. The zsh
# preexec hook captures wrapper names (pif/claudef), not their node process.
# Explicitly renamed windows keep automatic-rename off and are untouched.
setw -g automatic-rename on
setw -g automatic-rename-format '#{?@workspace-first-command,#{@workspace-first-command},#{?#{m/r:^(zsh|bash|sh|fish|dash|ksh)$,#{pane_current_command}},[empty],#{pane_current_command}}}'

set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_action 'copy-pipe'            # stay in copy mode after yank
set -g @override_copy_command '~/.config/tmux/scripts/yank.sh'
set -g @plugin 'tmux-plugins/tmux-resurrect#cff343cf9e81983d3da0c8562b01616f12e8d548'
set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key f
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'

# treemux: Neovim-powered file tree sidebar (prefix + Tab)
set -g @treemux-tree-client 'neo-tree'
set -g @treemux-tree-focus 'Tab'
set -g @treemux-tree-nvim-init-file "${HOME}/.config/tmux/treemux_init.lua"
set -g @treemux-python-command "${HOME}/.config/tmux/scripts/treemux-python.sh"
set -g @treemux-nvim-command 'NVIM_APPNAME=nvim-treemux nvim'
set -g @plugin 'kiyoon/treemux'

# Continuum stays installed for restore-on-start. Its save interval is zero,
# and the post-TPM wiring removes its status-line scheduler.
set -g @plugin 'tmux-plugins/tmux-continuum'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
# Swap Catppuccin's original window backgrounds, then lift both by the same
# minimal amount: inactive stays dark and selected stays slightly lighter.
set -g @dotfiles_window_default_background "#222232"
set -g @dotfiles_window_current_background "#353648"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory host"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
# Keep the directory chip to 18 display cells (17 plus an ellipsis when cut).
set -g @catppuccin_directory_text "#{=/17/…:#{b:pane_current_path}}"
set -g @catppuccin_meetings_text "#($HOME/.config/tmux/scripts/cal.sh)"
set -g @catppuccin_date_time_text "%H:%M"
set -g @catppuccin_host_indicator_text "#($HOME/.config/tmux/scripts/host_indicator.sh)"

set -g @continuum-restore 'on'

# Set hostname indicator color/icon (must run before TPM so catppuccin picks it up)
run '~/.config/tmux/scripts/host_indicator.sh'

# Local companion plugin: enrich Resurrect saves with command buffers,
# application sessions, and Treemux state.
run-shell '~/.config/tmux/local-plugins/tmux-workspace-resurrect/tmux-workspace-resurrect.tmux'

# Local companion plugin: selectively elevate a pane to a persistent remote
# tmux endpoint on an always-on worker. Must load after host_indicator.sh
# (extends @catppuccin_host_text) and before TPM (catppuccin reads it).
run-shell '~/.config/tmux/local-plugins/tmux-remote-workspaces/tmux-remote-workspaces.tmux'

# Local companion plugin: prefix o session picker with agent state and
# memory per session, window and pane. Agents publish their own state into
# pane options, so the picker reads one tmux snapshot on open.
run-shell '~/.config/tmux/local-plugins/tmux-agent-sessions/tmux-agent-sessions.tmux'

run '~/.config/tmux/plugins/tpm/tpm'

# tmux 3.7 stopped clearing the whole status row before drawing messages and
# prompts. It now honors alignment and only clears untouched cells when the
# new `fill` style is present. Catppuccin still installs align=centre without
# fill, leaving powerline fragments around centered warnings/prompts. Restore
# the original solid, left-aligned command row after TPM has loaded the theme.
%if "#{>=:#{version},3.7}"
set -g message-style "fg=#89dceb,bg=#313244,fill=#313244,align=left"
set -g message-command-style "fg=#89dceb,bg=#313244,fill=#313244,align=left"
%else
set -g message-style "fg=#89dceb,bg=#313244,align=left"
set -g message-command-style "fg=#89dceb,bg=#313244,align=left"
%endif

# Catppuccin hard-codes both window backgrounds, so override the generated
# formats after TPM with the swapped original colors above.
set -gw window-status-format "#[fg=#{@dotfiles_window_default_background},bg=#1e1e2e,nobold,nounderscore,noitalics]#{@catppuccin_window_left_separator}#[fg=#cdd6f4,bg=#{@dotfiles_window_default_background}]#{E:@catppuccin_window_default_text}#[fg=#89b4fa,bg=#{@dotfiles_window_default_background},nobold,nounderscore,noitalics]#{@catppuccin_window_middle_separator}#[fg=#{@dotfiles_window_default_background},bg=#89b4fa]#I#[fg=#89b4fa,bg=#1e1e2e]#{@catppuccin_window_right_separator}"
set -gw window-status-current-format "#[fg=#{@dotfiles_window_current_background},bg=#1e1e2e,nobold,nounderscore,noitalics]#{@catppuccin_window_left_separator}#[fg=#cdd6f4,bg=#{@dotfiles_window_current_background}]#{E:@catppuccin_window_current_text}#[fg=#fab387,bg=#{@dotfiles_window_current_background},nobold,nounderscore,noitalics]#{@catppuccin_window_middle_separator}#[fg=#{@dotfiles_window_current_background},bg=#fab387]#I#[fg=#fab387,bg=#1e1e2e]#{@catppuccin_window_right_separator}"

# Autosave freshness indicator: prepended to status-right after TPM finishes.
# The wiring also strips Continuum's save interpolation, leaving launchd or
# systemd as the only periodic scheduler. Repeated reloads stay idempotent. See
# tmux/scripts/autosave_indicator.sh (display) and
# tmux/scripts/wire_autosave_indicator.sh (idempotent prepend).
run-shell '~/.config/tmux/scripts/wire_autosave_indicator.sh'

# Current pane memory chip, prepended after the autosave chip so it renders
# to its left. See tmux/local-plugins/tmux-agent-sessions/scripts/wire-mem-chip.
run-shell '~/.config/tmux/local-plugins/tmux-agent-sessions/scripts/wire-mem-chip'

# TPM's tmux-resurrect entrypoint binds prefix+C-s directly to save.sh and
# Continuum points at that same unverified path. Replace both after TPM with
# the serialized/verified wrapper. The manual dispatcher additionally saves
# a focused remote-workspace worker and refreshes its powerline timestamp.
run-shell '~/.config/tmux/scripts/wire_resurrect_save.sh'

# Treemux installs its ordinary prefix+Tab binding during TPM startup. Replace
# it afterward with the remote-workspace dispatcher: local panes still launch
# local Treemux, while rw-backed panes launch Treemux inside the worker's
# endpoint tmux session so its path and every tree action stay remote.
bind-key Tab run-shell '~/.config/tmux/local-plugins/tmux-remote-workspaces/scripts/rw-treemux.sh || true'

# Override status bar background to be transparent (after plugins load)
set -g status-style "bg=default"

# Yank via custom script (handles OSC 52 over SSH, pbcopy locally)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-no-clear "~/.config/tmux/scripts/yank.sh"
