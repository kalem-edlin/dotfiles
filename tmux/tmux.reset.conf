# First remove *all* keybindings
# unbind-key -a
# Now reinsert all the regular tmux keys
bind ^X lock-server
# bind ^C new-window -c "$HOME"
bind c new-window -c "#{pane_current_path}"
bind ^D detach
bind * list-clients

bind H previous-window
bind L next-window

bind r command-prompt -I "#{window_name}" "rename-window -- '%%'"
bind R command-prompt -I "#{session_name}" "rename-session -- '%%'"
bind ^A last-window
bind z resize-pane -Z
bind ^L refresh-client
bind l refresh-client
# Remote-backed panes hand off to rw-split.sh so a new split inherits the
# same worker+workspace (tmux-remote-workspaces); plain panes split as before.
bind \\ run-shell '~/.config/tmux/local-plugins/tmux-remote-workspaces/scripts/rw-split.sh v'
bind / run-shell '~/.config/tmux/local-plugins/tmux-remote-workspaces/scripts/rw-split.sh h'
# Worker picker popup: choose a configured worker (live reachability, fzf
# ctrl-n/ctrl-p) and elevate the FOCUSED pane onto it via `rw ensure`.
bind e display-popup -E -w 70% -h 60% '~/.config/tmux/local-plugins/tmux-remote-workspaces/scripts/rw-picker.sh pick'
bind '"' choose-window
# Nav/resize are STOCK local commands even on remote-backed panes: the
# tree-as-endpoint Treemux design (2026-08-05) guarantees every endpoint's
# worker window is single-pane, so there is never a worker-side split to
# reach and no key needs ssh forwarding (the deleted rw-dispatch.sh layer).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7
bind : command-prompt
bind * setw synchronize-panes
bind P set pane-border-status
# Remote-backed panes (tmux-remote-workspaces) close via the lifecycle-aware
# `rw close` -- tombstone, remote teardown, then the local pane. Tree and
# editor endpoints are ordinary endpoints, so q on them closes exactly that
# pane and its own worker session (tree-as-endpoint design 2026-08-05).
# Plain panes keep the old kill-pane.
# --pane #{pane_id} is load-bearing: run-shell children spawn from the tmux
# server with no TMUX_PANE, so without the explicit pane the close dies with
# "no pane specified" and the key silently does nothing.
bind q if-shell -F '#{@rw-endpoint}' 'run-shell "~/.config/tmux/local-plugins/tmux-remote-workspaces/scripts/rw-close.sh --pane #{pane_id}"' 'kill-pane'
bind x swap-pane -D
bind S choose-session
# Intentional window close also closes any remote endpoints owned by panes
# in that window (tmux-remote-workspaces); confirm-before keeps the stock
# safety prompt since this is now destructive to remote state too.
bind & confirm-before -p "kill-window #W and its remote endpoints? (y/n)" "run-shell '~/.config/tmux/local-plugins/tmux-remote-workspaces/scripts/rw-close-window.sh'"
# Config reload. Incident 2026-08-05: tmux-resurrect's DEFAULT restore
# binding is ALSO prefix C-r, and TPM loads after this file -- so this
# reload was silently shadowed by a one-keystroke, no-confirmation restore
# of the entire landscape (which then blocked all tmux input while
# post-restore hooks waited out ssh timeouts against an offline worker).
# @resurrect-restore parks resurrect's own binding out of reach; restore is
# deliberate-only, behind a confirmation prompt on prefix C-M-r.
set -g @resurrect-restore 'M-F11'
bind C-r source-file ~/.config/tmux/tmux.conf
bind C-M-r confirm-before -p "Restore last tmux snapshot over the LIVE landscape? (y/n)" "run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh'"
bind K send-keys "clear"\; send-keys "Enter"
bind Space next-layout
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Swap window left/right with wrap-around
bind C-Left if-shell '[ #{window_index} -eq 1 ]' 'swap-window -t :$' 'swap-window -t -1'
bind C-Right if-shell '[ #{window_index} -eq #{session_windows} ]' 'swap-window -t 1' 'swap-window -t +1'
