# Curated bridge to the Material file glyphs used by Treemux. Eza's built-in
# icon database remains the fallback for folders and every file not listed.
filenames:
  # Common exact filenames from nvim-material-icon
  ".env": { icon: { glyph: "󰙪", style: { foreground: "#fbc02d" } } }
  ".env.example": { icon: { glyph: "󰙪", style: { foreground: "#fbc02d" } } }
  ".gitattributes": { icon: { glyph: "󰊢", style: { foreground: "#e64a19" } } }
